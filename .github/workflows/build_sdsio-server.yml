name: Build sdsio-server
on:
  workflow_dispatch:
    inputs:
      trigger_extension_build:
        description: 'Trigger CMSIS SDS extension build as part of this workflow.'
        required: false
        default: false
        type: boolean
  release:
    types:
      - published
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, ubuntu-24.04, macos-15, ubuntu-24.04-arm]
        include:
          - os: windows-2025
            artifact_name: sdsio-server-windows
            libusb_arch: MS64
          - os: windows-11-arm
            artifact_name: sdsio-server-windows-arm64
            libusb_arch: ARM64
          - os: ubuntu-24.04
            artifact_name: sdsio-server-linux
          - os: macos-15
            artifact_name: sdsio-server-macos
          - os: ubuntu-24.04-arm
            artifact_name: sdsio-server-linux-arm64

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Install dependencies
        run: pip install -r ./.github/requirements-sdsio-server.txt

      - name: Extract SDSIO-Server version
        shell: bash
        run: |
          SDSIO_SERVER_VERSION=$(sed -nE "s/^SDSIO_SERVER_VERSION[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" utilities/sdsio-server.py | head -n 1)
          test -n "$SDSIO_SERVER_VERSION" || { echo "Failed to extract SDSIO_SERVER_VERSION from utilities/sdsio-server.py"; exit 1; }
          echo "SDSIO_SERVER_VERSION=$SDSIO_SERVER_VERSION" >> "$GITHUB_ENV"

      - name: Prepare Windows libusb
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIBUSB_ARCH: ${{ matrix.libusb_arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.0.30'
          $baseUrl = "https://github.com/libusb/libusb/releases/download/v$version"
          $archives = @{
            "libusb-$version.7z" = '7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79'
            "libusb-$version.tar.bz2" = 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf'
          }
          New-Item -ItemType Directory -Force build\libusb, dist\sdsio-server-libusb | Out-Null
          foreach ($name in $archives.Keys) {
            $archive = Join-Path 'build\libusb' $name
            Invoke-WebRequest "$baseUrl/$name" -OutFile $archive
            if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $archives[$name]) {
              throw "SHA256 mismatch for $name"
            }
          }
          tar -xf "build\libusb\libusb-$version.7z" -C build\libusb "VS2025/$env:LIBUSB_ARCH/dll/libusb-1.0.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract libusb DLL' }
          tar -xf "build\libusb\libusb-$version.tar.bz2" -C build\libusb "libusb-$version/COPYING"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract libusb license' }
          Copy-Item "build\libusb\libusb-$version\COPYING" dist\sdsio-server-libusb\COPYING.libusb
          Copy-Item "build\libusb\libusb-$version.tar.bz2" dist\sdsio-server-libusb
          Copy-Item .github\libusb-notices.txt dist\sdsio-server-libusb\THIRD-PARTY-NOTICES.txt
          git archive --format=zip --output=dist/sdsio-server-libusb/application-source.zip HEAD utilities/sdsio-server.py .github/requirements-sdsio-server.txt LICENSE DEVELOPMENT.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to package application source' }
          $wrapperVersion = python -c "from importlib.metadata import version; print(version('libusb1'))"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine libusb1 version' }
          python -m pip download --no-deps --no-binary=:all: --dest dist\sdsio-server-libusb "libusb1==$wrapperVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to package libusb1 source' }
          "LIBUSB_DLL=$((Resolve-Path "build\libusb\VS2025\$env:LIBUSB_ARCH\dll\libusb-1.0.dll").Path)" >> $env:GITHUB_ENV

      - name: Build executable
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            EXTRA_ARGS+=(--add-binary "${LIBUSB_DLL}:usb1")
          fi
          python -m PyInstaller --clean --noconfirm --onefile --name sdsio-server "${EXTRA_ARGS[@]}" utilities/sdsio-server.py

      - name: Check bundled Windows USB library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import usb1
          with usb1.USBContext():
              print('Bundled libusb initialized successfully.')
          '@ | Set-Content build\check_usb.py
          python -m PyInstaller --clean --noconfirm --onefile --name check-usb --distpath build\usb-check --specpath build --add-binary "${env:LIBUSB_DLL}:usb1" build\check_usb.py
          if ($LASTEXITCODE -ne 0) { throw 'USB smoke-test build failed' }
          & .\build\usb-check\check-usb.exe
          if ($LASTEXITCODE -ne 0) { throw 'Bundled USB initialization failed' }

      - name: Check executable version
        shell: bash
        run: |
          EXECUTABLE_OUTPUT=$(dist/sdsio-server --version 2>&1 | tr -d '\r')
          echo "$EXECUTABLE_OUTPUT"
          EXECUTABLE_VERSION=$(echo "$EXECUTABLE_OUTPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)?' | head -n 1)

          [[ "$EXECUTABLE_VERSION" == "$SDSIO_SERVER_VERSION" ]] || {
            echo "Version mismatch: expected $SDSIO_SERVER_VERSION, got $EXECUTABLE_VERSION"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-${{ env.SDSIO_SERVER_VERSION }}
          path: dist/sdsio-server*
          retention-days: 7

  # Triggers the CMSIS SDS extension nightly workflow
  trigger-sds-extn:
    needs: [ build ]
    if: >-
      success() && github.repository == 'ARM-software/SDS-Framework' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_extension_build) || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Trigger vscode-cmsis-sds workflow
        run: |
          curl --fail-with-body --show-error --silent -X POST \
            -H "Authorization: Bearer ${{ secrets.CROSS_REPO_SDS_EXTN_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/Open-CMSIS-Pack/vscode-cmsis-sds/actions/workflows/nightly.yml/dispatches \
            -d '{"ref":"main"}'
